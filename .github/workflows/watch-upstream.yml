# Poll the upstream APT repositories on lesbonscomptes.com and, when the
# mirrored packages change, tag this repo and start build.yml on that tag.
#
# Not the odio-ci reusable watcher: that one follows GitHub releases, and
# upstream here is an APT repository. No PAT either: a tag pushed with
# GITHUB_TOKEN triggers no workflow, but a workflow_dispatch made with it does,
# so the build is dispatched explicitly.

name: Watch upstream upmpdcli

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log, do not push tag'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the tag
      actions: write   # dispatch build.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare upstream with the latest release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(./scripts/sync-upstream.sh plan)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Tag and start the build
        if: steps.plan.outputs.tag != '' && !inputs.dry_run
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Track upstream upmpdcli packages (${TAG})"
          git push origin "${TAG}"
          gh workflow run build.yml --ref "${TAG}"
